name: paper-harness

services:
  db:
    image: pgvector/pgvector:0.8.5-pg17-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-paper_harness}
      POSTGRES_USER: ${POSTGRES_USER:-paper_harness}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-paper_harness_local}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - paper-harness-postgres:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  api:
    profiles: ["app"]
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.api
    environment:
      APP_ENV: development
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-paper_harness}:${POSTGRES_PASSWORD:-paper_harness_local}@db:5432/${POSTGRES_DB:-paper_harness}
      TOPIC_CONFIG_PATH: /app/configs/topics/broad-llm-agents.yaml
    ports:
      - "${API_PORT:-8000}:8080"
    depends_on:
      db:
        condition: service_healthy
    init: true

  daily:
    profiles: ["job"]
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.daily
    environment:
      APP_ENV: development
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-paper_harness}:${POSTGRES_PASSWORD:-paper_harness_local}@db:5432/${POSTGRES_DB:-paper_harness}
      TOPIC_CONFIG_PATH: /app/configs/topics/broad-llm-agents.yaml
      ANALYSIS_MODE: ${ANALYSIS_MODE:-full_text}
      LLM_PROVIDER: ${LLM_PROVIDER:-deepseek}
      LLM_MODEL: ${LLM_MODEL:-deepseek-v4-flash}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      GROBID_URL: ${GROBID_URL:-http://grobid:8070}
      GROBID_AUDIENCE: ${GROBID_AUDIENCE:-}
      GROBID_AUTH_MODE: ${GROBID_AUTH_MODE:-none}
    depends_on:
      db:
        condition: service_healthy
    init: true

  grobid:
    profiles: ["analysis"]
    image: paper-harness-grobid:0.9.0-crf
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.grobid
    ports:
      - "127.0.0.1:${GROBID_PORT:-8070}:8070"
    init: true
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 512
    cpus: 4.0
    mem_limit: 8g
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m,mode=1777
      - /opt/grobid/grobid-home/tmp:rw,noexec,nosuid,size=512m,mode=1777
      - /opt/grobid/logs:rw,noexec,nosuid,size=64m,mode=1777
    ulimits:
      core:
        soft: 0
        hard: 0
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          bash -ec 'exec 3<>/dev/tcp/127.0.0.1/8070;
          printf "GET /api/health HTTP/1.0\r\nHost: localhost\r\nConnection: close\r\n\r\n" >&3;
          IFS= read -r status <&3;
          [[ "$$status" == *" 200 "* ]]'
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 120s
    restart: unless-stopped

volumes:
  paper-harness-postgres:
