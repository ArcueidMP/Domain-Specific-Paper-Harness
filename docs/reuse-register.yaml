schema_version: 1
updated_at: "2026-08-10"
entries:
  - project: arxiv.py
    upstream: https://github.com/lukasschwab/arxiv.py
    revision: "4.0.0"
    license: MIT
    integration_mode: pinned-package-dependency
    copied_files: []
    local_changes: none
    reason: Typed arXiv query, pagination, metadata, and PDF URL adapter boundary.
    update_strategy: Review release notes, API behavior, license, and Python 3.13.13 tests before changing the exact pin.
    constraints:
      - Daily discovery remains arXiv-only.
      - Application code owns cursor overlap, stable identity, versioning, transactions, and idempotency.
      - Adapter retry count and delay remain explicit, bounded, and mapped to domain errors.
    python_compatibility: Upstream declares Python 3.10 or newer; repository verification on exact CPython 3.13.13 is required before M1 completion.
  - project: GROBID
    upstream: https://github.com/grobidOrg/grobid
    revision: "0.9.0"
    release_commit: "b2251cb"
    license: Apache-2.0
    integration_mode: pinned-external-container-runtime
    source_copied: false
    copied_files: []
    local_changes: A first-party wrapper Dockerfile adds provenance labels, bundled license material, a health check, a dedicated UID/GID 10001, and narrowly owned scratch directories; no upstream source or model files are copied or modified.
    reason: Sole scientific PDF-to-TEI parser for explicitly selected full-text analysis.
    runtime:
      upstream_image: grobid/grobid:0.9.0-crf@sha256:24ba90eb1c959f65d812bcdb2cf79c677fa5fd7b95235de616b8bc9fa1317849
      flavor: CRF-only CPU image
      service_port: 8070
      health_endpoint: /api/health
      version_endpoint: /api/version
      digest_verification:
        status: verified
        checked_at: "2026-08-08"
        command: docker pull grobid/grobid:0.9.0-crf
        manifest_digest: sha256:24ba90eb1c959f65d812bcdb2cf79c677fa5fd7b95235de616b8bc9fa1317849
        verification: Docker pull and image inspection returned the same repository digest.
      local_smoke_test:
        status: passed
        checked_at: "2026-08-10"
        version_response: "version 0.9.0, revision 0.9.0"
        health_response: initialized and ready with 12 CRF models loaded and no model failures
        hardening: UID/GID 10001, a read-only root filesystem, bounded CPU, memory and process count, dropped capabilities, no-new-privileges, zero core-dump ulimit, init, and UID-owned 0700 tmpfs paths remained healthy.
        parsing: A bounded live parse of arXiv 1706.03762v7 completed through /api/processFulltextDocument without retaining the PDF.
    update_strategy: Verify the release tag, full source revision, license, container manifest digest, image contents, REST contract, and local fixture behavior before changing the pin.
    constraints:
      - The CRF image is selected for bounded CPU-only runtime size and cost; its lower extraction accuracy than the full deep-learning image must remain visible in provenance.
      - Full-text requests explicitly disable header, citation, and funder consolidation so GROBID cannot call Crossref or biblio-glutton.
      - TEI remains the source representation; no alternate parser or lossy client converter is permitted.
      - Cloud deployment accepts only an immutable Artifact Registry digest produced after mirroring the verified upstream image through the first-party wrapper.
    python_compatibility: GROBID is an isolated Java service and is exempt from the first-party CPython 3.13.13 runtime constraint.
license_review:
  checked_at: "2026-08-10"
  gate: scripts/check_dependency_licenses.py
  frontend_material_exporter: scripts/export_frontend_licenses.mjs
  policy:
    python: Traverse the installed first-party production closure including the specter2 extra, report available license metadata, and block known incompatible terms.
    frontend: Inspect pnpm's installed production license metadata with Corepack and npm network access disabled, and export material only from identity-matched roots inside the .pnpm store to a new repository/build-root directory.
    output: Package, version, and license only; package paths, authors, descriptions, and environment data are never emitted.
  verified:
    - The exact local CPython 3.13.13 production closure passed the policy gate; CI repeats it on the production Linux platform.
    - The frozen pnpm production closure used by the bundled React application passed the policy gate.
    - psycopg and psycopg-binary are used unmodified under LGPL-3.0-only and retain their installed distribution license files in the copied virtual environment.
    - External Dockerfile bases are pinned by immutable manifest digest; the direct GROBID and SPECTER2 Apache-2.0 licenses are recorded above.
    - The frontend exporter retains discovered license, notice, or copying files without treating inventory counts or hashes as legal invariants.
    - The pinned GROBID runtime and wrapper retain direct Apache-2.0 text, project notices, operating-system material, and upstream bundled notices.
    - Retained weak-copyleft or dual-license text includes EPL, CDDL, LGPL, and GPL with the Classpath exception or an alternative license. The wrapper keeps those files intact and does not modify the libraries.
    - Production Artifact Registry images use immutable digests; dependency and retained-notice reviews are repeated when a source release changes.
  accepted_limitations:
    - No OS-package SBOM was generated, so the focused review is not an image-wide legal attestation. Runtime operating-system copyright and common-license directories are retained instead.
    - Installed Python distribution metadata does not enumerate every component embedded in native wheels such as psycopg-binary, PyTorch, NumPy, lxml, or tokenizers; their upstream metadata and retained material are checked without a second heavy scanner.
    - The pinned GROBID image contains transitive Java and operating-system components without a scanner-generated complete SBOM; any upstream digest change requires a renewed review.
  release_decision: No incompatible license was found. The focused package review and retained notices are accepted for the private unmodified internal deployment; the documented SBOM and embedded-metadata gaps are limitations, not publication blockers.
audits:
  paperqa2:
    status: reviewed-incompatible-no-code-reuse
    upstream: https://github.com/Future-House/paper-qa
    revision: "v2026.03.18"
    commit: ac4ff91ad703e6816cb620ea579a98ca0c42c36f
    license: Apache-2.0
    source_copied: false
    reviewed_at: "2026-08-08"
    source_and_tests:
      - Reviewed the package source, readers, retrieval/evidence path, settings, metadata clients, and test workflow at the pinned revision.
      - Upstream CI exercises source tests on Python 3.11 and 3.13 and package tests on Python 3.12 and 3.13.
    dependency_graph: The base package pulls fhaviary with LLM support, fhlmi, LiteLLM, OpenAI, paper-qa-pypdf, Tantivy, tiktoken, tokenizers, Redis client support, and related provider and model dependencies that are not required by M2.
    python_compatibility: Upstream declares Python 3.11 or newer and Python 3.13 support. Its locked dependency graph resolved with exact local CPython 3.13.13, but the package was not installed or runtime-tested because the integration was rejected on architecture and policy grounds.
    decision: Do not install PaperQA2 and do not copy any PaperQA2 source. Keep deterministic section-aware passage mapping, evidence grounding, and context assembly as ordinary typed project-owned functions; there is no external evidence component requiring an EvidenceEnginePort in M2.
    reasons:
      - The default parsing path uses PyPDF instead of the required sole GROBID parser.
      - Default metadata and model behavior includes Crossref, Semantic Scholar, OpenAI models and embeddings, with optional OpenAlex and Unpaywall providers.
      - The high-level Docs path owns a separate file index, MD5 document identities, persistence, and retrieval policy instead of the repository PostgreSQL source of truth.
      - The JSON helper repairs and coerces malformed model output, and the evidence path retries or drops invalid contexts, conflicting with strict M2 validation and failure semantics.
      - The available PDF chunker uses overlapping character windows over page text and loses GROBID section and coordinate provenance, so selective vendoring would add notice and update burden without a useful boundary-preserving capability.
    update_strategy: Re-audit an exact future revision only if it offers a provider-free, parser-independent, strict-output lower-level module whose dependency graph and provenance model fit the repository boundaries.
  scholar_qa:
    status: reviewed-incompatible-no-code-reuse
    upstream: https://github.com/allenai/ai2-scholarqa-lib
    revision: "0.8.13"
    commit: db1fdf3746d6ae338473f0176110082228ee8635
    license: Apache-2.0
    source_copied: false
    copied_files: []
    local_changes: none
    reviewed_at: "2026-08-09"
    release_provenance:
      github_releases: none
      pypi_release: "ai2-scholar-qa 0.8.13, published 2026-03-20"
      note: The repository head declares version 0.8.13, but upstream provides no Git tag or GitHub release that cryptographically maps the PyPI artifact to the audited commit.
    architecture:
      - LLM query preprocessing and decomposition precede Semantic Scholar snippet and keyword retrieval.
      - A mixedbread-ai/mxbai-rerank-large-v1 reranker aggregates retained passages at paper level.
      - MultiStepQAPipeline performs quote extraction, outline planning, quote clustering, iterative section synthesis, and ArxivDIGESTables-based comparison tables.
      - PaperFinder, MultiStepQAPipeline, and ScholarQA are coupled to API, state, tracing, cache, retriever, reranker, and provider configuration.
    dependency_graph: The base package includes FastAPI, Modal, pandas 2.2.2, OpenAI, LiteLLM, Google Cloud Storage, LangSmith, diskcache, and provider-facing support. Its all extra pins torch 2.3.1, transformers 4.44.1, sentence-transformers 3.0.1, SentencePiece, Hugging Face tooling, and PEFT.
    python_compatibility: Upstream declares no Requires-Python value and configures Pyright for Python 3.11.3. The all extra is incompatible with exact CPython 3.13.13 because torch 2.3.1 has no CPython 3.13 wheel and pandas 2.2.2 predates official CPython 3.13 wheels. The package was not installed.
    decision: Do not install, vendor, or copy Ai2 Scholar QA. Reimplement only the useful architecture concepts as project-owned typed quote extraction, evidence clustering, and comparison planning over persisted Evidence, with strict DeepSeek JSON output and deterministic evidence linkage.
    reasons:
      - Default generation uses Claude Sonnet 3.7 with GPT-4o fallback and OpenAI moderation, conflicting with the DeepSeek-only and no-fallback policy.
      - Retrieval and reranking own external policy through Semantic Scholar snippets, keyword search, Modal, and an independent reranker instead of the repository ports and persisted corpus.
      - LiteLLM provider routing, local or GCS traces, caches, and broad retry behavior violate the provider, logging, and retry boundaries.
      - ClusterPlan carries a cot field, and some generation paths continue without quotes, conflicting with the no-chain-of-thought and evidence-required contracts.
      - The required comparison dimensions are already fixed by this product, so copying dynamic report prompts and orchestration adds coupling without a boundary-preserving component.
    update_strategy: Re-audit an exact future revision only if a provider-free, retriever-independent, strict-output quote or comparison module supports exact CPython 3.13.13 without bringing its API, state, cache, tracing, or fallback stack.
    constraints:
      - Treat Scholar QA only as an architecture reference; do not copy prompts or source files.
      - Comparison inputs must be persisted project evidence, not Scholar QA retrieval results.
      - No Anthropic, OpenAI, Google search, Modal, external reranker, alternate metadata provider, or model fallback may enter production wiring.
  pasa:
    status: reviewed-architecture-only-no-code-reuse
    upstream: https://github.com/bytedance/pasa
    revision: main
    commit: 2aaa6a9b1e48d24a2b7e21e8551f863dad9eeb84
    license: Apache-2.0
    source_copied: false
    copied_files: []
    local_changes: none
    reviewed_at: "2026-08-09"
    release_provenance:
      github_releases: none
      git_tags: none
      note: The audited main commit is the only exact upstream revision used for this decision.
    architecture:
      - PaperAgent coordinates a Crawler and Selector over a mutable PaperNode queue and expansion tree.
      - The Crawler emits regex-parsed Search and Expand actions for initial discovery and section-level citation expansion.
      - The Selector scores title-and-abstract candidates using the probability of a one-token True response.
      - Upstream discovery uses Google or Serper, arXiv and ar5iv, plus an independent local compressed paper database.
    upstream_limits:
      expand_layers: 2
      search_queries: 5
      search_papers: 10
      expand_papers: 20
      threads_num: 20
      limitation: These knobs do not provide persisted state, a total step or candidate bound, an explicit queue bound, stable stop reasons, or complete citation-depth enforcement.
    dependency_graph: The unpinned requirements list contains arxiv, flash-attn, wandb, rich, and lxml while the source additionally imports requests, BeautifulSoup, Transformers, and PyTorch. Crawler and Selector execution assumes local 7B checkpoints, CUDA, custom Transformers and TRL forks, and training or PPO components.
    python_compatibility: Upstream has no package metadata, Python declaration, lock file, or tests. Its GPU, flash-attn, custom-fork, and omitted dependency graph provides no credible exact CPython 3.13.13 compatibility claim, so direct installation was rejected and not attempted.
    decision: Reimplement only the documented Crawler and Selector architecture as first-party application code. Use the existing DeepSeek LLMPort, strict Pydantic action schemas, the approved Semantic Scholar tool allowlist, persisted search sessions, actions and candidates, and deterministic terminal stop reasons.
    reasons:
      - Google, Serper, ar5iv, and the independent local paper database are forbidden production sources.
      - Regex action parsing, broad exception handling, and silent empty or None returns violate strict external-output and failure semantics.
      - Mutable in-memory queue and list deduplication do not meet provenance, restart, idempotency, or inspectability requirements.
      - Upstream bounds do not enforce the required max_steps, max_queries, max_queue_size, max_citation_depth, and max_candidates contracts.
      - The 7B checkpoints, training stack, custom forks, and GPU assumptions are outside the approved DeepSeek runtime.
    update_strategy: Re-audit an exact future commit only if it isolates a tested, provider-neutral Crawler or Selector module with strict typed actions, complete execution bounds, and exact CPython 3.13.13 support.
    constraints:
      - Do not copy upstream prompts, PaperNode, agent code, utilities, checkpoints, training code, or PPO code.
      - Do not create vendored code under third_party/pasa while source_copied remains false.
      - The derived loop may invoke only search_papers, get_paper, get_references, get_citations, get_recommendations, and read_arxiv_paper.
      - Persist every action, candidate, provenance record, bound consumption, and terminal reason.
  specter2:
    status: integrated-v0.1-base-model-artifact
    upstream: https://github.com/allenai/SPECTER2
    revision: main
    commit: fac1cb0940fe7bd3c0db00973f6889ca0b481b63
    license: Apache-2.0
    source_copied: false
    model_artifacts_copied: true
    copied_files: []
    local_changes: First-party preparation verifies the pinned upstream weights, loads them with safe PyTorch behavior, converts them to safetensors, and writes a strict manifest. Production loading is local-only and offline.
    reviewed_at: "2026-08-10"
    release_provenance:
      github_releases: none
      git_tags: none
      repository_version_field: "1.0.1"
      note: The repository version field is not an upstream release and is not used as the model revision.
    selected_model:
      identifier: allenai/specter2_base
      revision: 3447645e1def9117997203454fa4495937bfbd83
      tokenizer_identifier: allenai/specter2_base
      tokenizer_revision: 3447645e1def9117997203454fa4495937bfbd83
      upstream: https://huggingface.co/allenai/specter2_base
      license: Apache-2.0
      source_weights_file: pytorch_model.bin
      source_weights_size_bytes: 439740465
      source_weights_sha256: 801eda968fad1752fe846a8e572bfdc25202be85544680dda4c99f4589646ebc
      distribution: Hash-verified safetensors conversion embedded only in the Daily production image; no weights are checked into Git.
      local_production_build:
        checked_at: "2026-08-10"
        generated_at: "2026-08-10T01:28:46.515266+00:00"
        model_safetensors_sha256: cc9c5c23887d2107626fdb71ea60e7489b5a14a05046f7e8b60056487ebf68ff
        image_size_bytes: 785573507
